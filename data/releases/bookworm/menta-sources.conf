[general]
description=Debian 12 "Bookworm"
codename=bookworm
alias=oldstable
keyring=/usr/share/keyrings/debian-archive-keyring.gpg

[mirrors]
default=https://deb.debian.org/debian
security=https://security.debian.org/debian-security
debug=https://deb.debian.org/debian-debug
security_debug=https://deb.debian.org/debian-security-debug
masterlist=/usr/share/menta-sources/Mirrors.masterlist
masterlist_url=https://mirror-master.debian.org/status/Mirrors.masterlist

[components]
available=main contrib non-free non-free-firmware
default=main contrib non-free non-free-firmware

[suites]
available=security updates backports proposed-updates
default=security updates

[keys]
keyserver=hkps://keyserver.ubuntu.com
